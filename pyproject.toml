[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-vim"
version = "0.1.0"
description = "Distraction-free, vim-style Telegram client for the terminal, restricted to one work chat folder"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Saidburxon Muxtor" }]
keywords = ["telegram", "tui", "terminal", "vim", "telethon", "textual", "focus", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    # Telethon 2 is a rewrite and Textual breaks APIs between majors: cap both.
    "telethon>=1.36,<2",
    "cryptg>=0.4",  # native AES; without it Telethon encrypts media in pure Python
    "typer>=0.12",
    "rich>=13",
    "textual>=8,<9",
]

[project.urls]
Homepage = "https://github.com/saidburhankhan/telegram-vim"
Issues = "https://github.com/saidburhankhan/telegram-vim/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
tg = "tg.commands:app"

[tool.setuptools.packages.find]
include = ["tg*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # typer.Argument/Option defaults are the Typer idiom

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
