# Copy to one of:
#   ./config.toml
#   ~/.config/telegram-vim/config.toml
#   any path, then export TG_CONFIG=/path/to/config.toml
#
# api_id / api_hash can also come from TG_API_ID / TG_API_HASH env vars
# (env vars take precedence over this file).

api_id = 1234567
api_hash = "0123456789abcdef0123456789abcdef"

# Name of the Telegram chat folder that acts as the allowlist.
# Only chats explicitly added to this folder are visible.
folder = "Work"

# Where the session file, allowlist cache, and logs live (created with 0700).
data_dir = "~/.local/share/telegram-vim"

# Where `tg download` saves files (Phase 2).
download_dir = "~/Downloads/telegram-vim"

[voice]
# Microphone for voice messages ("default" = system default input).
# List sources with: pactl list short sources
source = "default"
# Hold-Space detection relies on key autorepeat. If releasing Space doesn't send
# (or it sends too early), tune these to your keyboard repeat settings.
release_ms = 250   # no repeat for this long = key released
tap_ms = 700       # no repeat within this = it was a tap → hands-free mode

[notifications]
# Desktop notifications for new messages: "sound", "silent" (popup only), or "off".
# Switch live in the app with `n` (chat list) or Ctrl+N.
mode = "silent"

[notifications]
# Desktop popups for new messages in the folder's chats:
#   "sound"  popup + sound
#   "silent" popup only (default)
#   "off"    nothing (unread badges still update)
# Press n on the chat list (or Ctrl+N anywhere) to switch until restart.
mode = "silent"
